name: Generate Signing Key

on:
  workflow_dispatch:
    inputs:
      key_password:
        description: "Password for the keystore AND the key (used for both, kept secret in logs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-key:
    name: Generate keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        env:
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore oplus-assistant.jks \
            -alias oplus \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Oplus-Assistant, OU=WajahatNaeem056, O=WajahatNaeem056, L=Unknown, ST=Unknown, C=US"

      - name: Encode as base64 (what SIGNING_KEYSTORE_BASE64 needs)
        run: base64 -w 0 oplus-assistant.jks > oplus-assistant.jks.b64

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            oplus-assistant.jks
            oplus-assistant.jks.b64
          retention-days: 1
